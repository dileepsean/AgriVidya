<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AgriVidya Ad — screenshot this</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
html,body{height:100%}
body{background:#F4FAF7;overflow:hidden;position:relative;
  background-image:linear-gradient(rgba(15,110,86,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(15,110,86,.09) 1px,transparent 1px);
  background-size:6vmin 6vmin}
.wrap{position:relative;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:6vh 6vw 5vh;text-align:center}
.logo{height:5.2vh;margin-bottom:4vh}
.disp{font-family:'Sora',sans-serif;font-weight:800;color:#0E3A2C;letter-spacing:-.5px;line-height:.98;font-size:13vw}
.disp .rs{color:#1D9E75}
.sub{font-family:'Sora',sans-serif;font-weight:700;color:#0E3A2C;font-size:4.6vw;margin-top:3vh;max-width:90%}
.tag{position:absolute;font-family:'Sora',sans-serif;font-weight:800;color:#0E3A2C;background:#7CE0B0;border-radius:14px;font-size:4.4vw;padding:1.4vw 3vw;box-shadow:0 5px 0 rgba(13,42,34,.12);z-index:3}
.t1{top:30vh;left:5vw;transform:rotate(-9deg)}
.t2{top:30vh;right:5vw;transform:rotate(8deg)}
.t3{top:60vh;left:7vw;transform:rotate(7deg)}
.t4{top:60vh;right:6vw;transform:rotate(-8deg)}
.emo{position:absolute;font-size:9vw;z-index:3}
.e1{top:44vh;left:4vw;transform:rotate(-12deg)}
.e2{top:47vh;right:4vw;transform:rotate(10deg)}
.cta{margin-top:auto;width:100%;background:#fff;border:3px solid #1D9E75;border-radius:18px;font-family:'Sora',sans-serif;font-weight:800;color:#0E3A2C;font-size:5.4vw;padding:2.6vh 4vw;box-shadow:0 10px 0 #1D9E75}
.url{color:#0F6E56;font-weight:700;font-size:4vw;margin-top:2.4vh}
</style>
</head>
<body>
<div class="tag t1">Paper 1</div>
<div class="tag t2">Paper 2</div>
<div class="tag t3">200+ MCQs</div>
<div class="tag t4">Mock Tests</div>
<div class="emo e1">😮</div>
<div class="emo e2">🤯</div>
<div class="wrap">
  <img class="logo" src="/av-logo.png" alt="AgriVidya">
  <div class="disp">Only <span class="rs">₹249</span><br>to crack<br>AO/AAO</div>
  <div class="sub">Full syllabus + the skip strategy.<br>This is a steal. 🌾</div>
  <div class="cta">🔗 Tap to learn more 👉</div>
  <div class="url">agrividya.in/aao.html</div>
</div>
</body>
</html>
