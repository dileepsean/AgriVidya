<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AgriVidya Reader</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#021E17;--bg2:#04342C;--bar:#085041;--ln:#0F6E56;--ac:#1D9E75;--ac2:#5DCAA5;--mint:#9FE1CB;--txt:#E1F5EE}
body{background:radial-gradient(900px 500px at 80% -10%,rgba(29,158,117,.25),transparent 60%),var(--bg);color:var(--txt);min-height:100vh}
body.light{--bg:#EAF3EF;--txt:#0D1F1A}
.bar{background:linear-gradient(135deg,#0F6E56,#085041);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 4px 20px -8px rgba(0,0,0,.5)}
.bar .brand{display:flex;align-items:center;gap:8px}
.bar .logo{width:28px;height:28px;border-radius:7px;background:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px -3px rgba(0,0,0,.5)}
.bar .nm{font-family:'Sora',sans-serif;font-weight:800;color:#fff;font-size:15px;letter-spacing:-.3px}
.bar .sp{flex:1}
.bar button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(159,225,203,.25);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
.bar button:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.prog{height:5px;background:rgba(255,255,255,.12)}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));width:0;transition:width .4s ease;box-shadow:0 0 12px rgba(93,202,165,.6)}
.meta{text-align:center;font-size:12px;color:var(--mint);padding:8px;font-weight:500;letter-spacing:.2px}
.wrap{max-width:860px;margin:0 auto;padding:12px 12px 96px}
.pg{position:relative;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px -12px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:auto;pointer-events:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#0F6E56,#085041);display:flex;align-items:center;justify-content:center;gap:14px;padding:11px;z-index:20;border-top:1px solid var(--ln);box-shadow:0 -4px 24px -10px rgba(0,0,0,.6)}
.nav button{background:linear-gradient(135deg,var(--ac),#0F6E56);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px -8px rgba(29,158,117,.8);transition:all .2s}
.nav button:hover{transform:translateY(-2px);filter:brightness(1.08)}
.nav button:active{transform:translateY(0)}
.nav input{width:62px;text-align:center;border-radius:9px;border:1px solid var(--ln);padding:7px;background:#fff;color:#0D1F1A;font-weight:600;font-size:14px}
.gate{max-width:360px;margin:8vh auto;background:linear-gradient(160deg,rgba(15,110,86,.55),rgba(8,80,65,.85));border:1px solid var(--ln);border-radius:18px;padding:28px;backdrop-filter:blur(10px);box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
.gate .glogo{width:46px;height:46px;border-radius:12px;background:var(--ac);display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 8px 20px -6px rgba(29,158,117,.7)}
.gate h2{font-family:'Sora',sans-serif;color:#fff;font-size:21px;margin-bottom:4px;letter-spacing:-.3px}
.gate p{font-size:12.5px;color:var(--mint);margin-bottom:16px;line-height:1.5}
.gate input{width:100%;padding:11px 13px;margin-bottom:9px;border-radius:10px;border:1px solid var(--ln);background:rgba(255,255,255,.08);color:#fff;font-size:13px;outline:none;transition:border .2s}
.gate input:focus{border-color:var(--ac2)}
.gate input::placeholder{color:rgba(159,225,203,.6)}
.gate button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--ac),#0F6E56);color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 10px 24px -10px rgba(29,158,117,.8);transition:all .2s}
.gate button:hover{transform:translateY(-2px);filter:brightness(1.07)}
.gate .er{color:#ffb4a8;font-size:12px;margin-top:8px;display:none;line-height:1.4}
.gate .sw{font-size:12px;color:var(--mint);text-align:center;margin-top:12px;cursor:pointer}
.gate .sw:hover{color:#fff}
.ai{position:fixed;bottom:70px;right:14px;left:14px;max-width:560px;margin:0 auto;background:linear-gradient(160deg,#04342C,#021E17);border:1px solid var(--ln);border-radius:14px;padding:14px;z-index:30;display:none;box-shadow:0 24px 60px -24px rgba(0,0,0,.8)}
.ai textarea{width:100%;height:56px;border-radius:10px;border:1px solid var(--ln);background:rgba(255,255,255,.06);color:#fff;padding:9px;font-size:13px;resize:none;outline:none}
.ai .row{display:flex;gap:8px;margin-top:8px}
.ai button{background:linear-gradient(135deg,var(--ac),#0F6E56);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer}
.ai .ans{font-size:13px;color:var(--mint);margin-top:10px;max-height:170px;overflow:auto;line-height:1.65;white-space:pre-wrap}
.hide{display:none}
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

<div class="gate" id="gate">
  <div class="glogo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2C9 2 6 4.5 6 8c0 2 0.8 3.8 2 5V16h1v3h6v-3h1v-3c1.2-1.2 2-3 2-5 0-3.5-3-6-6-6z" fill="#021E17"/><circle cx="12" cy="8" r="2.5" fill="#9FE1CB"/></svg></div>
  <h2 id="gT">Log in to read</h2>
  <p>Your material is online-only and securely tied to your account.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go" onclick="doAuth()">Log in</button>
  <div class="er" id="er"></div>
  <div class="sw" id="sw" onclick="tog()">New here? Create account</div>
</div>

<div id="reader" class="hide">
  <div class="bar">
    <div class="brand"><img src="/av-logo-white.png" alt="AgriVidya" style="height:26px;width:auto;display:block"><span class="nm" style="opacity:.85;font-weight:500">Reader</span></div>
    <span class="sp"></span>
    <button onclick="askAI()">Ask AI</button>
    <button onclick="document.body.classList.toggle('light')">Theme</button>
    <button onclick="logout()">Exit</button>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <div class="meta" id="meta">Loading...</div>
  <div class="wrap"><div class="pg"><canvas id="cv"></canvas></div></div>
  <div class="nav">
    <button onclick="prev()">Prev</button>
    <input id="jump" type="number" min="1" onchange="jumpTo(this.value)">
    <button onclick="next()">Next</button>
  </div>
  <div class="ai" id="aiBox">
    <textarea id="aiQ" placeholder="Ask about what you are reading..."></textarea>
    <div class="row"><button onclick="sendAI()">Ask</button><button onclick="document.getElementById('aiBox').style.display='none'" style="background:#0F6E56">Close</button></div>
    <div class="ans" id="aiA"></div>
  </div>
</div>

<script>
const SUPA_URL='https://yrrielpjbbsxdgbwzwzx.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlycmllbHBqYmJzeGRnYnd6d3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NTY5NDMsImV4cCI6MjA5MDAzMjk0M30.v7jeOcfQU7-LAxWFSftnTHMSDbZmiTRJEN19bB1z5RA';
const BUCKET='books';
const CFG={
  paper1:{total:352, skip:[1,2,3,4], prefix:'paper1/p1-'},
  paper2:{total:617, skip:[1,2],     prefix:'paper2/p2-'}
};
const _p=new URLSearchParams(location.search).get('b');
const BOOK_ID=(_p==='paper2')?'paper2':'paper1';
const C=CFG[BOOK_ID];
const SKIP=new Set(C.skip);
const ORDER=[]; for(let n=1;n<=C.total;n++){ if(!SKIP.has(n)) ORDER.push(n); }
const TOTAL=ORDER.length;
function pad(n){ return C.prefix+String(n).padStart(3,'0')+'.jpg'; }
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let mode='login', user=null, pos=0, myTok=Math.random().toString(36).slice(2), saveT=null;
function tog(){ mode=(mode==='login')?'signup':'login'; document.getElementById('gT').textContent=(mode==='login')?'Log in to read':'Create account'; document.getElementById('go').textContent=(mode==='login')?'Log in':'Sign up'; document.getElementById('sw').textContent=(mode==='login')?'New here? Create account':'Have an account? Log in'; }
function showEr(m){ var e=document.getElementById('er'); e.textContent=m; e.style.display='block'; }
async function doAuth(){
  document.getElementById('er').style.display='none';
  var e=document.getElementById('em').value.trim(), p=document.getElementById('pw').value;
  if(!e||!p){ showEr('Enter email and password'); return; }
  var res=(mode==='login')?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
  if(res.error){ showEr(res.error.message); return; }
  if(mode==='signup' && !res.data.session){ showEr('Account made. Confirm via email, then log in.'); return; }
  start(res.data.user);
}
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function start(u){
  user=u;
  var r1=await sb.from('book_access').select('active').eq('user_id',u.id).eq('book_id',BOOK_ID).maybeSingle();
  if(!r1.data || r1.data.active===false){
    document.getElementById('gT').textContent='No access yet';
    var er=document.getElementById('er'); er.textContent='This account has not purchased this material. Buy it on the E-Books page.'; er.style.display='block';
    document.getElementById('go').style.display='none'; document.getElementById('sw').style.display='none'; return;
  }
  await sb.from('user_sessions').upsert({user_id:u.id,session_token:myTok,updated_at:new Date().toISOString()});
  setInterval(chkSession,8000);
  var r2=await sb.from('reading_progress').select('last_page').eq('user_id',u.id).eq('book_id',BOOK_ID).maybeSingle();
  if(r2.data && r2.data.last_page){ var i=ORDER.indexOf(r2.data.last_page); pos=(i>=0)?i:0; } else { pos=0; }
  document.getElementById('gate').classList.add('hide');
  document.getElementById('reader').classList.remove('hide');
  document.getElementById('jump').max=TOTAL; render();
}
async function chkSession(){ var r=await sb.from('user_sessions').select('session_token').eq('user_id',user.id).maybeSingle(); if(r.data && r.data.session_token!==myTok){ alert('Opened on another device - logged out.'); logout(); } }
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
async function render(){
  var pageNum=ORDER[pos];
  document.getElementById('meta').textContent='Loading...';
  var s=await sb.storage.from(BUCKET).createSignedUrl(pad(pageNum),120);
  if(s.error || !s.data){ document.getElementById('meta').textContent='Page unavailable.'; return; }
  var im=new Image(); im.crossOrigin='anonymous';
  im.onload=function(){
    cv.width=im.width; cv.height=im.height; ctx.drawImage(im,0,0);
    ctx.save(); ctx.globalAlpha=.14; ctx.fillStyle='#0F6E56'; ctx.font=Math.round(im.width/26)+'px sans-serif'; ctx.rotate(-.4);
    for(var y=0;y<im.height*1.5;y+=240){ for(var x=-200;x<im.width;x+=540){ ctx.fillText(user.email,x,y); } }
    ctx.restore();
    var pct=Math.round((pos+1)/TOTAL*100);
    document.getElementById('bar').style.width=pct+'%';
    document.getElementById('meta').textContent='Page '+(pos+1)+' / '+TOTAL+'  -  '+pct+'% done  -  '+(TOTAL-pos-1)+' pages left';
    document.getElementById('jump').value=pos+1; saveProgress(pageNum);
  };
  im.src=s.data.signedUrl;
}
function saveProgress(pageNum){ clearTimeout(saveT); saveT=setTimeout(function(){ sb.from('reading_progress').upsert({user_id:user.id,book_id:BOOK_ID,last_page:pageNum,updated_at:new Date().toISOString()}); },700); }
function next(){ if(pos<TOTAL-1){ pos++; render(); window.scrollTo(0,0); } }
function prev(){ if(pos>0){ pos--; render(); window.scrollTo(0,0); } }
function jumpTo(v){ v=parseInt(v); if(v>=1 && v<=TOTAL){ pos=v-1; render(); window.scrollTo(0,0); } }
function askAI(){ document.getElementById('aiBox').style.display='block'; document.getElementById('aiQ').focus(); }
async function sendAI(){
  var q=document.getElementById('aiQ').value.trim(); if(!q) return;
  var a=document.getElementById('aiA'); a.textContent='Thinking...';
  try{
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:'Agri/Food engineering exam study help. '+q}],max_tokens:500})});
    var d=await r.json(); if(d.error) throw 0;
    a.textContent=(d.content && d.content[0] ? d.content[0].text : '').replace(/[*#]/g,'');
  }catch(e){ a.textContent='AI is busy right now. Try again shortly.'; }
}
document.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey) && ['s','p','u'].indexOf(e.key.toLowerCase())>=0){ e.preventDefault(); } if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); });
sb.auth.getSession().then(function(o){ if(o.data.session) start(o.data.session.user); });
</script>
</body>
</html>
